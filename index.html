<!DOCTYPE html>
<html lang="en">
<head>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta name="wb-build" content="replan-1003e" />
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="color-scheme" content="dark light"/>
<meta name="theme-color" content="#0b1412" media="(prefers-color-scheme: dark)"/>
<meta name="theme-color" content="#f3f8f5" media="(prefers-color-scheme: light)"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="Branding trip"/>
<title>Branding trip</title>
<style>
:root {
  --bg: #0b1412;
  --bg-elev: #0f1a17;
  --surface: rgba(22, 36, 32, 0.82);
  --surface-solid: #162420;
  --surface2: rgba(30, 48, 43, 0.9);
  --border: rgba(120, 160, 145, 0.14);
  --border-strong: rgba(120, 160, 145, 0.22);
  --text: #eef6f2;
  --muted: #8fa89c;
  --accent: #2dd4a8;
  --accent-2: #14b8a6;
  --accent-soft: rgba(45, 212, 168, 0.14);
  --accent-ink: #042f24;
  --done: #34d399;
  --done-soft: rgba(52, 211, 153, 0.14);
  --skip: #f0b429;
  --skip-soft: rgba(240, 180, 41, 0.14);
  --skip-ink: #3a2800;
  --pending: #7a9288;
  --danger: #fb7185;
  --shadow: 0 8px 28px rgba(0, 0, 0, 0.28);
  --shadow-sm: 0 2px 10px rgba(0, 0, 0, 0.18);
  --radius: 18px;
  --radius-sm: 12px;
  --tap: 48px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --font: "DM Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
@media (prefers-color-scheme: light) {
  :root {
    --bg: #f3f8f5;
    --bg-elev: #eef6f1;
    --surface: rgba(255, 255, 255, 0.88);
    --surface-solid: #ffffff;
    --surface2: rgba(232, 242, 236, 0.95);
    --border: rgba(30, 80, 60, 0.08);
    --border-strong: rgba(30, 80, 60, 0.14);
    --text: #12241d;
    --muted: #5f7a6e;
    --accent: #0d9488;
    --accent-2: #0f766e;
    --accent-soft: rgba(13, 148, 136, 0.12);
    --accent-ink: #ffffff;
    --done: #059669;
    --done-soft: rgba(5, 150, 105, 0.12);
    --skip: #d97706;
    --skip-soft: rgba(217, 119, 6, 0.12);
    --skip-ink: #ffffff;
    --pending: #7a8f85;
    --danger: #e11d48;
    --shadow: 0 10px 30px rgba(18, 50, 40, 0.08);
    --shadow-sm: 0 2px 8px rgba(18, 50, 40, 0.05);
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; padding: 0;
  color: var(--text);
  font-family: var(--font);
  font-size: 16px; line-height: 1.45;
  letter-spacing: -0.01em;
  -webkit-font-smoothing: antialiased;
}
html {
  background:
    radial-gradient(1200px 600px at 10% -10%, rgba(45, 212, 168, 0.18), transparent 55%),
    radial-gradient(900px 500px at 95% 5%, rgba(20, 184, 166, 0.12), transparent 50%),
    radial-gradient(800px 700px at 50% 110%, rgba(52, 211, 153, 0.08), transparent 55%),
    var(--bg);
  background-attachment: fixed;
  min-height: 100%;
}
body {
  background: transparent;
  padding-bottom: calc(92px + var(--safe-b));
  min-height: 100vh;
}
a { color: var(--accent); }

.top {
  position: sticky; top: 0; z-index: 40;
  background: color-mix(in srgb, var(--bg) 78%, transparent);
  backdrop-filter: blur(18px) saturate(1.2);
  -webkit-backdrop-filter: blur(18px) saturate(1.2);
  border-bottom: 1px solid var(--border);
  padding: 14px 16px 0;
}
.top h1 {
  margin: 0;
  font-size: 1.28rem;
  font-weight: 700;
  letter-spacing: -0.03em;
  background: linear-gradient(120deg, var(--text) 40%, var(--accent));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
@supports not ((-webkit-background-clip: text) or (background-clip: text)) {
  .top h1 { color: var(--text); background: none; }
}
.top .sub {
  color: var(--muted);
  font-size: 0.82rem;
  margin-top: 6px;
  font-weight: 500;
  letter-spacing: 0.01em;
}
.top .sub b.done { color: var(--done); font-weight: 700; }
.top .sub b.left { color: var(--accent); font-weight: 700; }

.tabs {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 4px;
  margin-top: 14px;
  padding: 4px;
  background: var(--surface2);
  border-radius: 999px;
  border: 1px solid var(--border);
}
.tab {
  min-height: 40px;
  border: none;
  background: transparent;
  color: var(--muted);
  font-family: inherit;
  font-weight: 600;
  font-size: 0.88rem;
  cursor: pointer;
  border-radius: 999px;
  padding: 8px 10px;
  transition: background .18s, color .18s, box-shadow .18s;
}
.tab.active {
  color: var(--accent-ink);
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  box-shadow: 0 4px 14px rgba(13, 148, 136, 0.28);
}

.boot-note {
  margin: 12px 16px 0;
  padding: 11px 14px;
  border-radius: 14px;
  background: var(--accent-soft);
  border: 1px solid color-mix(in srgb, var(--accent) 22%, transparent);
  font-size: 0.84rem;
  color: var(--muted);
  font-weight: 500;
}

main { padding: 16px 14px 28px; max-width: 640px; margin: 0 auto; }

.panel-day { display: none; }
.panel-day.show { display: block; }

.day-hero {
  margin-bottom: 16px;
  padding: 18px 18px 16px;
  border-radius: calc(var(--radius) + 4px);
  background: var(--surface);
  border: 1px solid var(--border-strong);
  box-shadow: var(--shadow);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  position: relative;
  overflow: hidden;
}
.day-hero::before {
  content: "";
  position: absolute;
  inset: 0 auto auto 0;
  width: 100%;
  height: 3px;
  background: linear-gradient(90deg, var(--accent), transparent 70%);
  opacity: 0.9;
}
.day-hero .label {
  font-size: 0.72rem;
  color: var(--accent);
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
}
.day-hero .title {
  font-size: 1.32rem;
  font-weight: 700;
  margin-top: 6px;
  letter-spacing: -0.03em;
  line-height: 1.25;
}
.day-hero .plan {
  color: var(--muted);
  font-size: 0.92rem;
  margin: 10px 0 0;
  line-height: 1.5;
  font-weight: 450;
}
.day-hero .empty {
  color: var(--muted);
  font-size: 0.95rem;
  font-style: italic;
  margin-top: 12px;
}

.maps-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  width: 100%;
  min-height: 52px;
  margin: 16px 0 2px;
  border-radius: 999px;
  border: none;
  cursor: pointer;
  background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);
  color: var(--accent-ink);
  font-family: inherit;
  font-weight: 700;
  font-size: 0.98rem;
  letter-spacing: -0.01em;
  text-decoration: none;
  box-shadow: 0 8px 22px rgba(13, 148, 136, 0.32);
  transition: transform .12s, box-shadow .12s, filter .12s;
}
.maps-btn:active { transform: scale(0.985); filter: brightness(0.96); }
.maps-btn.hidden { display: none !important; }
.add-stop-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  min-height: 50px;
  margin-top: 14px;
  border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent);
  border-radius: 999px;
  background: var(--accent-soft);
  color: var(--accent);
  font-family: inherit;
  font-weight: 700;
  font-size: 0.94rem;
  cursor: pointer;
  transition: transform .12s, background .15s, filter .15s;
}
.add-stop-btn:active { transform: scale(0.985); filter: brightness(0.96); }
.added-meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-top: 8px;
  color: var(--accent);
  font-size: 0.78rem;
  font-weight: 600;
}
.remove-stop {
  border: 0;
  padding: 2px 0;
  background: transparent;
  color: var(--muted);
  font: inherit;
  font-weight: 600;
  text-decoration: underline;
  cursor: pointer;
}
.remove-stop:active { color: var(--danger); }

.branch {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  margin-top: 12px;
  box-shadow: var(--shadow-sm);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  transition: border-color .18s, background .18s;
}
.branch.status-done {
  border-color: color-mix(in srgb, var(--done) 45%, var(--border));
  background: color-mix(in srgb, var(--done-soft) 55%, var(--surface));
}
.branch.status-skipped {
  border-color: color-mix(in srgb, var(--skip) 40%, var(--border));
  background: color-mix(in srgb, var(--skip-soft) 50%, var(--surface));
  opacity: 0.94;
}
.branch-name {
  font-weight: 700;
  font-size: 1.06rem;
  letter-spacing: -0.02em;
}
.branch-code {
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 0.68rem;
  font-weight: 600;
  color: var(--muted);
  margin-left: 8px;
  letter-spacing: 0.02em;
  opacity: 0.85;
}
.branch-addr {
  color: var(--muted);
  font-size: 0.88rem;
  margin-top: 6px;
  line-height: 1.4;
  font-weight: 450;
}
.status-pill {
  display: inline-block;
  margin-top: 10px;
  font-size: 0.68rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  padding: 4px 10px;
  border-radius: 999px;
  background: var(--surface2);
  color: var(--pending);
}
.branch.status-done .status-pill {
  color: var(--done);
  background: var(--done-soft);
}
.branch.status-skipped .status-pill {
  color: var(--skip);
  background: var(--skip-soft);
}

.btns {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-top: 14px;
}
.btn {
  min-height: var(--tap);
  border-radius: 999px;
  border: 1px solid var(--border-strong);
  background: var(--surface2);
  color: var(--text);
  font-family: inherit;
  font-weight: 650;
  font-size: 0.92rem;
  cursor: pointer;
  padding: 8px 14px;
  transition: transform .12s, background .15s, border-color .15s, color .15s;
}
.btn:active { transform: scale(0.98); }
.btn.done {
  border-color: color-mix(in srgb, var(--done) 45%, var(--border));
  color: var(--done);
  background: var(--done-soft);
}
.btn.skip {
  border-color: color-mix(in srgb, var(--skip) 40%, var(--border));
  color: var(--skip);
  background: var(--skip-soft);
}
.btn.active.done {
  background: var(--done);
  color: #052e1c;
  border-color: var(--done);
  box-shadow: 0 4px 14px rgba(5, 150, 105, 0.28);
}
.btn.active.skip {
  background: var(--skip);
  color: var(--skip-ink);
  border-color: var(--skip);
  box-shadow: 0 4px 14px rgba(217, 119, 6, 0.25);
}

.skip-reason { margin-top: 12px; display: none; }
.skip-reason.show { display: block; }
.skip-reason input {
  width: 100%;
  min-height: 46px;
  border-radius: 999px;
  border: 1px solid var(--border-strong);
  background: color-mix(in srgb, var(--bg) 70%, var(--surface-solid));
  color: var(--text);
  padding: 10px 16px;
  font: inherit;
  outline: none;
}
.skip-reason input:focus {
  border-color: color-mix(in srgb, var(--accent) 55%, var(--border));
  box-shadow: 0 0 0 3px var(--accent-soft);
}

/* All tab accordion */
.day {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  margin-bottom: 12px;
  overflow: hidden;
  box-shadow: var(--shadow-sm);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}
.day.today {
  border-color: color-mix(in srgb, var(--accent) 50%, var(--border));
  box-shadow: var(--shadow), 0 0 0 1px color-mix(in srgb, var(--accent) 25%, transparent);
}
.day-head {
  padding: 15px 16px;
  cursor: pointer;
  user-select: none;
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 10px;
  align-items: start;
}
.day-head .label {
  font-size: 0.7rem;
  color: var(--muted);
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.07em;
}
.day.today .day-head .label { color: var(--accent); }
.day-head .title {
  font-size: 1.02rem;
  font-weight: 700;
  margin-top: 4px;
  letter-spacing: -0.02em;
  line-height: 1.3;
}
.day-head .badge {
  font-size: 0.7rem;
  font-weight: 700;
  padding: 5px 10px;
  border-radius: 999px;
  background: var(--surface2);
  color: var(--muted);
  white-space: nowrap;
  letter-spacing: 0.02em;
}
.day.today .badge {
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  color: var(--accent-ink);
}
.day-body { padding: 0 14px 16px; display: none; }
.day.open .day-body { display: block; }
.day-note-plan {
  color: var(--muted);
  font-size: 0.9rem;
  margin: 0 0 10px;
  line-height: 1.45;
}
.empty-day {
  color: var(--muted);
  font-size: 0.9rem;
  font-style: italic;
  padding: 4px 0;
}

.dock {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  z-index: 50;
  background: color-mix(in srgb, var(--bg) 82%, transparent);
  backdrop-filter: blur(20px) saturate(1.15);
  -webkit-backdrop-filter: blur(20px) saturate(1.15);
  border-top: 1px solid var(--border);
  padding: 12px 14px calc(12px + var(--safe-b));
  display: grid;
  grid-template-columns: 1.45fr 1fr 0.85fr;
  gap: 8px;
  max-width: 640px;
  margin: 0 auto;
}
.dock button, .dock a.dock-btn {
  min-height: var(--tap);
  border-radius: 999px;
  font-family: inherit;
  font-weight: 700;
  font-size: 0.88rem;
  border: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  text-decoration: none;
  color: var(--text);
  transition: transform .12s, filter .12s;
}
.dock button:active, .dock a.dock-btn:active { transform: scale(0.98); }
.dock .primary {
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  color: var(--accent-ink);
  box-shadow: 0 6px 18px rgba(13, 148, 136, 0.3);
}
.dock .secondary {
  background: var(--surface2);
  color: var(--text);
  border: 1px solid var(--border-strong);
}
.dock .primary.disabled { opacity: 0.42; pointer-events: none; box-shadow: none; }

.toast {
  position: fixed;
  left: 50%;
  bottom: calc(96px + var(--safe-b));
  transform: translateX(-50%);
  background: var(--text);
  color: var(--bg);
  padding: 11px 18px;
  border-radius: 999px;
  font-size: 0.85rem;
  font-weight: 600;
  opacity: 0;
  pointer-events: none;
  transition: opacity .2s;
  z-index: 60;
  white-space: nowrap;
  max-width: 90vw;
  overflow: hidden;
  text-overflow: ellipsis;
  box-shadow: var(--shadow);
}
.toast.show { opacity: 1; }

.modal-bg {
  position: fixed;
  inset: 0;
  background: rgba(6, 14, 12, 0.58);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  z-index: 70;
  display: none;
  align-items: flex-end;
  justify-content: center;
}
.modal-bg.show { display: flex; }
.modal {
  background: var(--surface-solid);
  border-radius: 22px 22px 0 0;
  width: 100%;
  max-width: 640px;
  padding: 20px 18px calc(20px + var(--safe-b));
  border: 1px solid var(--border-strong);
  box-shadow: 0 -12px 40px rgba(0, 0, 0, 0.25);
}
.modal h2 {
  margin: 0 0 6px;
  font-size: 1.15rem;
  letter-spacing: -0.02em;
}
.modal p {
  margin: 0 0 16px;
  color: var(--muted);
  font-size: 0.9rem;
  line-height: 1.45;
}
.modal .row { display: grid; gap: 9px; }
.modal .btn {
  width: 100%;
  min-height: var(--tap);
  border-radius: 999px;
  border: 1px solid var(--border-strong);
  background: var(--surface2);
  color: var(--text);
  font-family: inherit;
  font-weight: 650;
  font-size: 0.9rem;
  cursor: pointer;
}
.add-stop-search {
  width: 100%;
  min-height: 46px;
  margin: 2px 0 12px;
  padding: 10px 16px;
  border: 1px solid var(--border-strong);
  border-radius: 999px;
  background: color-mix(in srgb, var(--bg) 70%, var(--surface-solid));
  color: var(--text);
  font: inherit;
  outline: none;
}
.add-stop-search:focus {
  border-color: color-mix(in srgb, var(--accent) 55%, var(--border));
  box-shadow: 0 0 0 3px var(--accent-soft);
}
.add-stop-list {
  display: grid;
  gap: 8px;
  max-height: min(52vh, 430px);
  overflow-y: auto;
  overscroll-behavior: contain;
}
.add-stop-row {
  display: block;
  width: 100%;
  padding: 12px 14px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--surface2);
  color: var(--text);
  text-align: left;
  font: inherit;
  cursor: pointer;
}
.add-stop-row:active { background: var(--accent-soft); }
.add-stop-row-top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.add-stop-row-name { font-weight: 700; }
.add-stop-row-code { color: var(--muted); font: 600 0.72rem ui-monospace, SFMono-Regular, Menlo, monospace; }
.add-stop-row-day { margin-top: 3px; color: var(--muted); font-size: 0.78rem; }
.add-stop-empty { padding: 12px 2px; color: var(--muted); font-size: 0.88rem; }

.add-stop-filter {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
  margin: 0 0 10px;
  padding: 4px;
  border-radius: 999px;
  background: color-mix(in srgb, var(--bg) 55%, var(--surface-solid));
  border: 1px solid var(--border);
}
.add-stop-filter button {
  border: 0;
  border-radius: 999px;
  min-height: 36px;
  padding: 6px 10px;
  background: transparent;
  color: var(--muted);
  font: inherit;
  font-size: 0.82rem;
  font-weight: 650;
  cursor: pointer;
}
.add-stop-filter button.active {
  background: var(--accent-soft);
  color: var(--accent);
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 35%, transparent);
}
.add-stop-note {
  margin: -4px 0 10px;
  color: var(--muted);
  font-size: 0.78rem;
}
.add-stop-row-meta {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 6px;
}
.add-stop-open-pill {
  display: inline-flex;
  align-items: center;
  padding: 2px 8px;
  border-radius: 999px;
  font-size: 0.68rem;
  font-weight: 700;
  letter-spacing: 0.02em;
  text-transform: uppercase;
}
.add-stop-open-pill.open {
  background: var(--done-soft);
  color: var(--done);
}
.add-stop-open-pill.closed {
  background: var(--skip-soft);
  color: var(--skip);
}
.add-stop-open-pill.na {
  background: color-mix(in srgb, var(--muted) 18%, transparent);
  color: var(--muted);
}
.add-stop-row-sub {
  color: var(--muted);
  font-size: 0.76rem;
  line-height: 1.35;
}

.hidden { display: none !important; }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet"/>
</head>
<body>
<noscript>
  <div style="padding:16px;font-family:sans-serif">This trip app needs JavaScript. Download the HTML and open it in Safari or Chrome.</div>
</noscript>

<div class="top">
  <h1>Branding trip</h1>
<p id="wbBuild" style="margin:4px 0 0;font-size:12px;opacity:.7">Build replan-1003e · ignore Gosport+Dorchester</p>
  <div class="sub" id="statsLine">Done <b class="done" id="nDone">0</b> · Left <b class="left" id="nLeft">0</b></div>
  <div class="tabs" role="tablist">

let state = loadState();
let activeTab = 'today'; // today | tomorrow | all
let focusDate = null; // date shown in Today/Tomorrow panels
let addStopDate = null; // day currently targeted by the Add stop modal
let addStopFilter = 'open'; // open | all
let addStopGeoAnchor = null; // {lat,lng} from geolocation when available
let openDays = {}; // All-tab accordion open state

function todayISO() {
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

function addDaysISO(iso, n) {
  const [y,m,d] = iso.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  dt.setDate(dt.getDate() + n);
  const yy = dt.getFullYear();
  const mm = String(dt.getMonth()+1).padStart(2,'0');
  const dd = String(dt.getDate()).padStart(2,'0');
  return `${yy}-${mm}-${dd}`;
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed && typeof parsed === 'object') {
        parsed.branches = parsed.branches || {};
        parsed.dayNotes = parsed.dayNotes || {};
        parsed.adds = parsed.adds || {};
        return parsed;
      }
    }
  } catch (e) {}
  return { branches: {}, dayNotes: {}, adds: {}, updatedAt: null };
}

function saveState() {
  state.updatedAt = new Date().toISOString();
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  updateStats();
}

let _pushTimer = null;
let _pushBusy = false;
function schedulePushToSheet() {
  if (!SHEET.syncUrl || SHEET.syncUrl.includes('REPLACE_')) return;
  clearTimeout(_pushTimer);
  _pushTimer = setTimeout(() => { pushToSheet({ silent: true }); }, 1200);
}

function branchKey(date, code) { return date + '|' + code; }

function getBranchState(date, code) {
  const k = branchKey(date, code);
  return state.branches[k] || { status: 'pending', notes: '', skipReason: '', updated_at: '' };
}

function setBranchStatus(date, code, status) {
  const k = branchKey(date, code);
  const cur = getBranchState(date, code);
  // Toggle: tapping active Done/Skip returns to pending
  if (cur.status === status) status = 'pending';
  const next = { ...cur, status, updated_at: new Date().toISOString() };
  if (status !== 'skipped') next.skipReason = '';
  state.branches[k] = next;
  saveState();
  schedulePushToSheet();
  return next;
}

function setSkipReason(date, code, reason) {
  const k = branchKey(date, code);
  const cur = getBranchState(date, code);
  state.branches[k] = { ...cur, skipReason: reason, notes: cur.notes || reason, updated_at: new Date().toISOString() };
  saveState();
  schedulePushToSheet();
}

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove('show'), 2200);
}

function updateStats() {
  let done=0, skip=0, pend=0, total=0;
  for (const day of TRIP_DATA.days) {
    for (const b of branchesForDay(day)) {
      total++;
      const st = getBranchState(b._homeDate || day.date, b.code).status;
      if (st === 'done') done++;
      else if (st === 'skipped') skip++;
      else pend++;
    }
  }
  document.getElementById('nDone').textContent = done;
  document.getElementById('nLeft').textContent = pend;
}

function escapeHtml(s) {
  return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(s) {
  return escapeHtml(s).replace(/\n/g, ' ');
}

function findDay(date) {
  return TRIP_DATA.days.find(d => d.date === date) || null;
}

function findBranchHome(code) {
  for (const day of TRIP_DATA.days) {
    const branch = day.branches.find(b => b.code === code);
    if (branch) return { day, branch };
  }
  return null;
}

function branchesForDay(day) {
  if (!day) return [];
  const adds = state.adds || {};
  const addedToday = new Set(Array.isArray(adds[day.date]) ? adds[day.date] : []);
  const addedElsewhere = new Set();
  for (const [date, codes] of Object.entries(adds)) {
    if (date !== day.date && Array.isArray(codes)) {
      codes.forEach(code => addedElsewhere.add(code));
    }
  }
  const result = [];
  for (const branch of day.branches) {
    if (!addedElsewhere.has(branch.code) && !addedToday.has(branch.code)) result.push(branch);
  }
  for (const code of addedToday) {
    const home = findBranchHome(code);
    if (home) result.push({ ...home.branch, _added: true, _homeDate: home.day.date });
  }
  return result;
}

function nearestDay(iso) {
  return TRIP_DATA.days.find(d => d.date >= iso) || TRIP_DATA.days[TRIP_DATA.days.length - 1];
}

function branchAddress(b) {
  const addr = (b.address || '').trim();
  const pc = (b.pc || '').trim();
  if (addr && pc && !addr.toUpperCase().includes(pc.toUpperCase())) return addr + ', ' + pc;
  return addr || pc || b.name || '';
}

function dayRouteBranches(day) {
  const branches = branchesForDay(day);
  if (!branches.length) return [];
  const pending = branches.filter(b => getBranchState(b._homeDate || day.date, b.code).status === 'pending');
  return pending.length ? pending : branches.slice();
}

function mapsUrlForBranches(branches) {
  if (!branches.length) return null;
  const stops = branches.map(b => encodeURIComponent(branchAddress(b)));
  if (stops.length === 1) {
    return 'https://www.google.com/maps/dir/?api=1&travelmode=driving&destination=' + stops[0];
  }
  const origin = stops[0];
  const destination = stops[stops.length - 1];
  let url = 'https://www.google.com/maps/dir/?api=1&travelmode=driving&origin=' + origin + '&destination=' + destination;
  if (stops.length > 2) {
    url += '&waypoints=' + stops.slice(1, -1).join('|');
  }
  return url;
}

function mapsUrlForDay(day) {
  return mapsUrlForBranches(dayRouteBranches(day));
}

function branchCardHtml(day, b) {
  const homeDate = b._homeDate || day.date;
  const st = getBranchState(homeDate, b.code);
  const skShow = st.status === 'skipped' ? ' show' : '';
  const homeDay = b._added ? findDay(homeDate) : null;
  const addedHtml = b._added
    ? `<div class="added-meta"><span>Added · was ${escapeHtml(homeDay ? homeDay.label : homeDate)}</span><button type="button" class="remove-stop" data-remove-date="${escapeAttr(day.date)}">Remove</button></div>`
    : '';
  return `<div class="branch status-${st.status}" data-code="${escapeAttr(b.code)}" data-date="${escapeAttr(homeDate)}">
    <div>
      <span class="branch-name">${escapeHtml(b.name)}</span>
      <span class="branch-code">${escapeHtml(b.code)}</span>
    </div>
    <div class="branch-addr">${escapeHtml(b.address || '')}</div>
    ${addedHtml}
    <span class="status-pill">${st.status}</span>
    <div class="btns">
      <button type="button" class="btn done${st.status==='done'?' active':''}" data-act="done">Done</button>
      <button type="button" class="btn skip${st.status==='skipped'?' active':''}" data-act="skip">Skip</button>
    </div>
    <div class="skip-reason${skShow}">
      <input type="text" placeholder="Skip reason (optional)" value="${escapeAttr(st.skipReason||'')}" data-skip-reason/>
    </div>
  </div>`;
}

function removeAddedStop(dayDate, code) {
  if (!state.adds || !Array.isArray(state.adds[dayDate])) return;
  state.adds[dayDate] = state.adds[dayDate].filter(c => c !== code);
  if (!state.adds[dayDate].length) delete state.adds[dayDate];
  saveState();
  render();
  toast('Stop removed');
}

function bindBranchCards(root) {
  root.querySelectorAll('.branch').forEach(br => {
    const date = br.dataset.date;
    const code = br.dataset.code;
    const remove = br.querySelector('[data-remove-date]');
    if (remove) {
      remove.addEventListener('click', (e) => {
        e.stopPropagation();
        removeAddedStop(remove.dataset.removeDate, code);
      });
    }
    br.querySelectorAll('[data-act]').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const act = btn.dataset.act === 'skip' ? 'skipped' : 'done';
        setBranchStatus(date, code, act);
        render();
      });
    });
    const skipInp = br.querySelector('[data-skip-reason]');
    if (skipInp) {
      skipInp.addEventListener('change', () => setSkipReason(date, code, skipInp.value));
      skipInp.addEventListener('blur', () => setSkipReason(date, code, skipInp.value));
      skipInp.addEventListener('click', (e) => e.stopPropagation());
    }
  });
}

function renderFocusDay(day) {
  const panel = document.getElementById('panelFocus');
  if (!day) {
    panel.innerHTML = '<div class="day-hero"><div class="title">No day found</div></div>';
    return;
  }
  focusDate = day.date;
  const plan = (day.notes || '').trim();
  const branches = branchesForDay(day);
  let body = '';
  if (!branches.length) {
    body = `<div class="empty">${escapeHtml(day.blockReason || 'No branch visits this day.')}</div>`;
  } else {
    body = branches.map(b => branchCardHtml(day, b)).join('');
  }
  const maps = mapsUrlForDay(day);
  const mapsHtml = maps
    ? `<a class="maps-btn" href="${maps}" target="_blank" rel="noopener">Open Google Maps route</a>`
    : '';
  const addHtml = `<button type="button" class="add-stop-btn" id="btnAddStop">Add stop</button>`;

  panel.innerHTML = `
    <div class="day-hero">
      <div class="label">${escapeHtml(day.label)}</div>
      <div class="title">${escapeHtml(day.title)}</div>
      ${plan ? `<p class="plan">${escapeHtml(plan)}</p>` : ''}
      ${mapsHtml}
      ${body}
      ${addHtml}
    </div>`;
  bindBranchCards(panel);
  document.getElementById('btnAddStop').addEventListener('click', () => openAddStopModal(day));
  updateDockMaps(day);
}

function renderAll() {
  const today = todayISO();
  const root = document.getElementById('panelAll');
  root.innerHTML = '';
  for (const day of TRIP_DATA.days) {
    const isToday = day.date === today;
    const el = document.createElement('article');
    const isOpen = openDays[day.date] != null ? openDays[day.date] : isToday;
    el.className = `day${isToday?' today':''}${isOpen?' open':''}`;
    el.id = 'day-' + day.date;
    el.dataset.date = day.date;

    const branches = branchesForDay(day);
    const doneN = branches.filter(b => getBranchState(b._homeDate || day.date,b.code).status==='done').length;
    const skipN = branches.filter(b => getBranchState(b._homeDate || day.date,b.code).status==='skipped').length;
    let badge = branches.length ? `${doneN+skipN}/${branches.length}` : (day.kind || '');
    if (isToday) badge = 'TODAY · ' + badge;

    let branchesHtml = '';
    if (!branches.length) {
      branchesHtml = `<div class="empty-day">${escapeHtml(day.blockReason || 'No branch visits this day.')}</div>`;
    } else {
      branchesHtml = branches.map(b => branchCardHtml(day, b)).join('');
    }
    const maps = mapsUrlForDay(day);
    const mapsHtml = maps
      ? `<a class="maps-btn" href="${maps}" target="_blank" rel="noopener">Open Google Maps route</a>`
      : '';
    const plan = (day.notes || '').trim();

    el.innerHTML = `
      <div class="day-head">
        <div>
          <div class="label">${escapeHtml(day.label)}</div>
          <div class="title">${escapeHtml(day.title)}</div>
        </div>
        <span class="badge">${escapeHtml(badge)}</span>
      </div>
      <div class="day-body">
        ${plan ? `<p class="day-note-plan">${escapeHtml(plan)}</p>` : ''}
        ${mapsHtml}
        ${branchesHtml}
      </div>`;

    el.querySelector('.day-head').addEventListener('click', () => {
      el.classList.toggle('open');
      openDays[day.date] = el.classList.contains('open');
    });
    bindBranchCards(el);
    root.appendChild(el);
  }
}

function updateDockMaps(day) {
  const btn = document.getElementById('btnDockMaps');
  const d = day || (focusDate ? findDay(focusDate) : null);
  if (activeTab === 'all') {
    // On All tab, map dock to today (or nearest)
    const t = findDay(todayISO()) || nearestDay(todayISO());
    const url = mapsUrlForDay(t);
    if (url) {
      btn.href = url;
      btn.classList.remove('disabled');
      btn.textContent = 'Maps route';
    } else {
      btn.href = '#';
      btn.classList.add('disabled');
      btn.textContent = 'No route';
    }
    return;
  }
  const url = d ? mapsUrlForDay(d) : null;
  if (url) {
    btn.href = url;
    btn.classList.remove('disabled');
    btn.textContent = 'Maps route';
  } else {
    btn.href = '#';
    btn.classList.add('disabled');
    btn.textContent = 'No route';
  }
}

function setTab(tab) {
  activeTab = tab;
  document.querySelectorAll('.tab').forEach(t => {
    t.classList.toggle('active', t.dataset.tab === tab);
  });
  const focus = document.getElementById('panelFocus');
  const all = document.getElementById('panelAll');
  if (tab === 'all') {
    focus.classList.remove('show');
    all.classList.add('show');
    renderAll();
    updateDockMaps(null);
  } else {
    all.classList.remove('show');
    focus.classList.add('show');
    const today = todayISO();
    const targetIso = tab === 'tomorrow' ? addDaysISO(today, 1) : today;
    let day = findDay(targetIso);
    if (!day && tab === 'today') day = nearestDay(today);
    if (!day && tab === 'tomorrow') {
      // show empty tomorrow if outside trip
      document.getElementById('panelFocus').innerHTML =
        `<div class="day-hero"><div class="label">${escapeHtml(targetIso)}</div>
         <div class="title">No plan for tomorrow</div>
         <div class="empty">Outside trip dates or no entry.</div></div>`;
      focusDate = targetIso;
      updateDockMaps(null);
      return;
    }
    renderFocusDay(day);
  }
}

const DOW_KEYS = ['sun','mon','tue','wed','thu','fri','sat'];
const DOW_SHORT = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

function londonNowParts() {
  const parts = new Intl.DateTimeFormat('en-GB', {
    timeZone: 'Europe/London', weekday: 'short', hour: '2-digit', minute: '2-digit',
    hourCycle: 'h23'
  }).formatToParts(new Date());
  const map = {};
  for (const p of parts) if (p.type !== 'literal') map[p.type] = p.value;
  const wd = (map.weekday || '').slice(0, 3);
  const idx = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].indexOf(wd);
  return {
    dowKey: idx >= 0 ? DOW_KEYS[idx] : DOW_KEYS[new Date().getDay()],
    dowShort: idx >= 0 ? DOW_SHORT[idx] : DOW_SHORT[new Date().getDay()],
    minutes: (parseInt(map.hour, 10) || 0) * 60 + (parseInt(map.minute, 10) || 0)
  };
}

function parseClockToken(tok) {
  if (!tok) return null;
  let s = String(tok).trim().toLowerCase().replace(/\s+/g, '');
  s = s.replace(/[.–—]/g, ':');
  const am = /am$/.test(s);
  const pm = /pm$/.test(s);
  s = s.replace(/(am|pm)$/, '');
  let h, m;
  if (s.includes(':')) {
    const [a, b] = s.split(':');
    h = parseInt(a, 10); m = parseInt(b || '0', 10);
  } else if (s.includes('.')) {
    const [a, b] = s.split('.');
    h = parseInt(a, 10); m = parseInt(b || '0', 10);
    if ((b || '').length === 1) m = m * 10;
  } else {
    h = parseInt(s, 10); m = 0;
  }
  if (!Number.isFinite(h) || !Number.isFinite(m)) return null;
  if (pm && h < 12) h += 12;
  if (am && h === 12) h = 0;
  if (!am && !pm && h >= 24) return null;
  return h * 60 + m;
}

function parseHoursRanges(raw) {
  if (raw == null) return null;
  let s = String(raw).trim();
  if (!s || /^off$/i.test(s) || /^closed$/i.test(s)) return [];
  s = s.replace(/[;|]/g, ',').replace(/–|—/g, '-');
  const parts = s.split(',').map(x => x.trim()).filter(Boolean);
  const ranges = [];
  for (const part of parts) {
    const m = part.match(/^(.+?)\s*-\s*(.+)$/);
    if (!m) continue;
    let startTok = m[1].trim();
    let endTok = m[2].trim();
    // bare hour on end like "2–6pm" — inherit am/pm from end if start lacks it
    if (!/(am|pm)$/i.test(startTok) && /(am|pm)$/i.test(endTok) && !/[:.]/.test(startTok)) {
      // keep as-is; parseClockToken handles number-only as 24h-ish — fix: if end is pm and start < 12 assume same meridian only when start has no meridian and looks like hour
      const endIsPm = /pm$/i.test(endTok);
      const endIsAm = /am$/i.test(endTok);
      const sn = parseFloat(startTok);
      if (Number.isFinite(sn) && sn <= 12) {
        if (endIsPm && sn !== 12) startTok = startTok + 'pm';
        else if (endIsAm) startTok = startTok + 'am';
      }
    }
    const a = parseClockToken(startTok);
    const b = parseClockToken(endTok);
    if (a == null || b == null) continue;
    ranges.push({ start: a, end: b });
  }
  return ranges;
}

function formatHoursDisplay(raw, dowShort) {
  if (raw == null || String(raw).trim() === '') return 'Hours n/a';
  const s = String(raw).trim();
  if (/^off$/i.test(s) || /^closed$/i.test(s)) return 'Closed today';
  // normalize dashes for display
  const nice = s.replace(/\s*-\s*/g, '–').replace(/–+/g, '–');
  return dowShort + ' ' + nice;
}

function opennessForCode(code, nowParts) {
  const meta = BRANCH_META[code];
  if (!meta || !meta.hours) {
    return { kind: 'unknown', label: 'Hours n/a', pill: 'Hours n/a', ranges: null, opensLater: false };
  }
  const raw = meta.hours[nowParts.dowKey];
  const ranges = parseHoursRanges(raw);
  const hoursLine = formatHoursDisplay(raw, nowParts.dowShort);
  if (ranges === null) {
    return { kind: 'unknown', label: hoursLine, pill: 'Hours n/a', ranges: null, opensLater: false };
  }
  if (!ranges.length) {
    return { kind: 'closed', label: 'Closed today', pill: 'Closed', ranges, opensLater: false };
  }
  const now = nowParts.minutes;
  const openNow = ranges.some(r => now >= r.start && now < r.end);
  if (openNow) {
    return { kind: 'open', label: hoursLine, pill: 'Open', ranges, opensLater: false };
  }
  const opensLater = ranges.some(r => now < r.start);
  return { kind: 'closed', label: hoursLine, pill: 'Closed', ranges, opensLater };
}

function haversineMiles(a, b) {
  if (!a || !b || a.lat == null || b.lat == null || a.lng == null || b.lng == null) return null;
  const R = 3958.7613;
  const toRad = d => d * Math.PI / 180;
  const dLat = toRad(b.lat - a.lat);
  const dLng = toRad(b.lng - a.lng);
  const lat1 = toRad(a.lat), lat2 = toRad(b.lat);
  const h = Math.sin(dLat/2)**2 + Math.cos(lat1)*Math.cos(lat2)*Math.sin(dLng/2)**2;
  return 2 * R * Math.asin(Math.min(1, Math.sqrt(h)));
}

function avgLatLng(branches) {
  let n = 0, lat = 0, lng = 0;
  for (const b of branches || []) {
    const m = BRANCH_META[b.code];
    if (!m || m.lat == null || m.lng == null) continue;
    lat += m.lat; lng += m.lng; n++;
  }
  if (!n) return null;
  return { lat: lat / n, lng: lng / n };
}

function dayAverageAnchor(day) {
  if (!day) return null;
  const onDay = avgLatLng(branchesForDay(day));
  if (onDay) return onDay;
  const idx = TRIP_DATA.days.findIndex(d => d.date === day.date);
  for (let i = idx + 1; i < TRIP_DATA.days.length; i++) {
    const a = avgLatLng(branchesForDay(TRIP_DATA.days[i]));
    if (a) return a;
  }
  for (let i = idx - 1; i >= 0; i--) {
    const a = avgLatLng(branchesForDay(TRIP_DATA.days[i]));
    if (a) return a;
  }
  return null;
}

function resolveAddStopAnchor(day) {
  if (addStopGeoAnchor && addStopGeoAnchor.lat != null) return addStopGeoAnchor;
  return dayAverageAnchor(day);
}

function requestAddStopGeolocation() {
  if (!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(
    (pos) => {
      addStopGeoAnchor = { lat: pos.coords.latitude, lng: pos.coords.longitude };
      if (document.getElementById('addStopModal').classList.contains('show')) renderAddStopList();
    },
    () => { /* denied or unavailable — keep day average */ },
    { enableHighAccuracy: false, maximumAge: 120000, timeout: 8000 }
  );
}

function opennessSortRank(open) {
  if (open.kind === 'open') return 0;
  if (open.kind === 'closed' && open.opensLater) return 1;
  if (open.kind === 'closed') return 2;
  return 3;
}

function renderAddStopList() {
  const list = document.getElementById('addStopList');
  const note = document.getElementById('addStopNote');
  const day = addStopDate ? findDay(addStopDate) : null;
  const query = (document.getElementById('addStopSearch').value || '').trim().toLowerCase();
  if (!day) {
    list.innerHTML = '<div class="add-stop-empty">No day selected.</div>';
    if (note) { note.hidden = true; note.textContent = ''; }
    return;
  }
  const shown = new Set(branchesForDay(day).map(b => b.code));
  const nowParts = londonNowParts();
  const anchor = resolveAddStopAnchor(day);
  const candidates = [];
  for (const homeDay of TRIP_DATA.days) {
    for (const branch of homeDay.branches) {
      if (shown.has(branch.code)) continue;
      if (getBranchState(homeDay.date, branch.code).status !== 'pending') continue;
      const haystack = (branch.name + ' ' + branch.code + ' ' + homeDay.label).toLowerCase();
      if (query && !haystack.includes(query)) continue;
      const open = opennessForCode(branch.code, nowParts);
      const meta = BRANCH_META[branch.code];
      const dist = meta ? haversineMiles(anchor, meta) : null;
      candidates.push({ day: homeDay, branch, open, dist });
    }
  }
  candidates.sort((a, b) => {
    const ra = opennessSortRank(a.open), rb = opennessSortRank(b.open);
    if (ra !== rb) return ra - rb;
    const da = a.dist == null ? Infinity : a.dist;
    const db = b.dist == null ? Infinity : b.dist;
    if (da !== db) return da - db;
    return a.day.date.localeCompare(b.day.date) || a.branch.name.localeCompare(b.branch.name);
  });
  const closedCount = candidates.filter(c => c.open.kind === 'closed' && !c.open.opensLater).length;
  const unknownCount = candidates.filter(c => c.open.kind === 'unknown').length;
  let shownList = candidates;
  if (addStopFilter === 'open') {
    // Open now + opens later today; hide closed-today and unknown.
    shownList = candidates.filter(c => c.open.kind === 'open' || (c.open.kind === 'closed' && c.open.opensLater));
  }
  const hiddenClosed = addStopFilter === 'open' ? (closedCount + unknownCount) : 0;
  if (note) {
    if (addStopFilter === 'open' && hiddenClosed > 0) {
      note.hidden = false;
      note.textContent = hiddenClosed + ' closed hidden';
    } else {
      note.hidden = true;
      note.textContent = '';
    }
  }
  if (!shownList.length) {
    list.innerHTML = '<div class="add-stop-empty">' +
      (candidates.length && addStopFilter === 'open'
        ? 'No open pending branches nearby. Try All pending.'
        : 'No pending branches match.') + '</div>';
    return;
  }
  list.innerHTML = shownList.map(({ day: homeDay, branch, open, dist }) => {
    const pillClass = open.kind === 'open' ? 'open' : (open.kind === 'closed' ? 'closed' : 'na');
    const distTxt = dist == null ? '' : (' · ~' + (dist < 10 ? dist.toFixed(1) : Math.round(dist)) + ' mi');
    const sub = open.label + distTxt + ' · Planned ' + homeDay.label;
    return `
    <button type="button" class="add-stop-row" data-add-code="${escapeAttr(branch.code)}">
      <span class="add-stop-row-top"><span class="add-stop-row-name">${escapeHtml(branch.name)}</span><span class="add-stop-row-code">${escapeHtml(branch.code)}</span></span>
      <span class="add-stop-row-meta"><span class="add-stop-open-pill ${pillClass}">${escapeHtml(open.pill)}</span></span>
      <span class="add-stop-row-sub">${escapeHtml(sub)}</span>
    </button>`;
  }).join('');
  list.querySelectorAll('[data-add-code]').forEach(row => {
    row.addEventListener('click', () => addStopToDay(addStopDate, row.dataset.addCode));
  });
}

function openAddStopModal(day) {
  addStopDate = day && day.date;
  addStopFilter = 'open';
  addStopGeoAnchor = null;
  const modal = document.getElementById('addStopModal');
  document.getElementById('addStopHint').textContent = day
    ? ('Suggesting nearby open branches for ' + day.label + '.')
    : 'Choose a pending branch to add to this day.';
  document.getElementById('addStopSearch').value = '';
  document.querySelectorAll('#addStopFilter [data-filter]').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.filter === addStopFilter);
  });
  renderAddStopList();
  modal.classList.add('show');
  requestAddStopGeolocation();
  setTimeout(() => document.getElementById('addStopSearch').focus(), 0);
}

function addStopToDay(dayDate, code) {
  const home = findBranchHome(code);
  if (!home || !dayDate) return;
  state.adds = state.adds || {};
  for (const date of Object.keys(state.adds)) {
    state.adds[date] = (state.adds[date] || []).filter(c => c !== code);
    if (!state.adds[date].length) delete state.adds[date];
  }
  state.adds[dayDate] = state.adds[dayDate] || [];
  if (!state.adds[dayDate].includes(code)) state.adds[dayDate].push(code);
  saveState();
  document.getElementById('addStopModal').classList.remove('show');
  render();
  toast(home.day.date === dayDate ? 'Stop added' : 'Stop moved to ' + (findDay(dayDate)?.label || dayDate));
}

function render() {
  if (activeTab === 'all') renderAll();
  else {
    const day = focusDate ? findDay(focusDate) : findDay(todayISO());
    if (day) renderFocusDay(day);
    else setTab(activeTab);
  }
  updateStats();
}

function jsonp(url, timeoutMs) {
  return new Promise((resolve, reject) => {
    const cb = '_wbCb' + Date.now() + Math.floor(Math.random()*1e6);
    const t = setTimeout(() => { cleanup(); reject(new Error('Sync timed out')); }, timeoutMs || 20000);
    function cleanup() {
      clearTimeout(t);
      try { delete window[cb]; } catch(e) {}
      if (s && s.parentNode) s.parentNode.removeChild(s);
    }
    window[cb] = (data) => { cleanup(); resolve(data); };
    const s = document.createElement('script');
    const join = url.includes('?') ? '&' : '?';
    s.src = url + join + 'callback=' + cb;
    s.onerror = () => { cleanup(); reject(new Error('Sync network error')); };
    document.head.appendChild(s);
  });
}

function applySheetRows(rows) {
  let n = 0;
  for (const r of rows) {
    if (!r.code || !r.date) continue;
    const status = ['done','skipped','pending','blocked'].includes(r.status) ? r.status : 'pending';
    if (status === 'blocked') continue;
    const k = branchKey(r.date, r.code);
    state.branches[k] = {
      status: status === 'blocked' ? 'pending' : status,
      notes: r.notes || '',
      skipReason: status==='skipped' ? (r.notes||'') : '',
      updated_at: r.updated_at || new Date().toISOString()
    };
    n++;
  }
  saveState();
  render();
  return n;
}

function importCsvText(text) {
  const rows = parseCsv(text);
  let n = 0;
  for (const r of rows) {
    if (!r.code || !r.date) continue;
    const status = ['done','skipped','pending'].includes(r.status) ? r.status : 'pending';
    const k = branchKey(r.date, r.code);
    state.branches[k] = {
      status,
      notes: r.notes || '',
      skipReason: status==='skipped' ? (r.notes||'') : '',
      updated_at: r.updated_at || new Date().toISOString()
    };
    n++;
  }
  saveState();
  render();
  toast('Imported ' + n + ' rows');
}

function parseCsv(text) {
  const lines = text.replace(/^\uFEFF/, '').trim().split(/\r?\n/);
  if (!lines.length) return [];
  const split = (line) => {
    const out = []; let cur = ''; let q = false;
    for (let i=0;i<line.length;i++) {
      const c = line[i];
      if (q) {
        if (c === '"' && line[i+1] === '"') { cur += '"'; i++; }
        else if (c === '"') q = false;
        else cur += c;
      } else {
        if (c === '"') q = true;
        else if (c === ',') { out.push(cur); cur = ''; }
        else cur += c;
      }
    }
    out.push(cur);
    return out;
  };
  const header = split(lines[0]).map(h => h.trim().toLowerCase());
  const idx = Object.fromEntries(header.map((h,i)=>[h,i]));
  const need = ['date','code','status'];
  if (!need.every(k => k in idx)) throw new Error('CSV needs date, code, status columns');
  const rows = [];
  for (let i=1;i<lines.length;i++) {
    if (!lines[i].trim()) continue;
    const cols = split(lines[i]);
    rows.push({
      date: cols[idx.date],
      code: cols[idx.code],
      name: idx.name!=null ? cols[idx.name] : '',
      status: (cols[idx.status]||'pending').toLowerCase(),
      notes: idx.notes!=null ? cols[idx.notes] : '',
      updated_at: idx.updated_at!=null ? cols[idx.updated_at] : ''
    });
  }
  return rows;
}

async function pullFromSheet() {
  toast('Pulling from Sheet…');
  try {
    if (SHEET.syncUrl && !SHEET.syncUrl.includes('REPLACE_')) {
      const data = await jsonp(SHEET.syncUrl + (SHEET.syncUrl.includes('?')?'&':'?') + 'action=get');
      if (data && data.rows) {
        applySheetRows(data.rows);
        toast('Pulled ' + data.rows.length + ' rows from Sheet');
        return;
      }
    }
    const res = await fetch(SHEET.csvUrl + '&_ts=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) throw new Error('CSV HTTP ' + res.status + ' — share Sheet as Anyone with the link can view');
    const text = await res.text();
    if (text.trim().startsWith('<') || text.includes('<!DOCTYPE')) {
      throw new Error('Sheet not publicly viewable yet — open Sheet → Share → Anyone with the link → Viewer');
    }
    importCsvText(text);
    toast('Pulled from Sheet CSV');
  } catch (err) {
    toast(String(err.message || err));
  }
}

function buildStatusPayload() {
  const rows = [];
  for (const day of TRIP_DATA.days) {
    for (const b of day.branches) {
      const st = getBranchState(day.date, b.code);
      rows.push({
        date: day.date,
        code: b.code,
        name: b.name,
        status: st.status || 'pending',
        notes: (st.status==='skipped' && st.skipReason) ? st.skipReason : (st.notes||''),
        updated_at: st.updated_at || ''
      });
    }
  }
  return rows;
}

async function pushToSheet(opts) {
  opts = opts || {};
  const silent = !!opts.silent;
  if (_pushBusy) { if (!silent) toast('Push already running…'); return; }
  if (!silent) toast('Pushing to Sheet…');
  try {
    if (!SHEET.syncUrl || SHEET.syncUrl.includes('REPLACE_')) {
      if (silent) return;
      toast('Sync bridge not configured');
      return;
    }
    _pushBusy = true;
    const rows = buildStatusPayload();
    const chunkSize = 25;
    let done = 0;
    for (let i = 0; i < rows.length; i += chunkSize) {
      const chunk = rows.slice(i, i + chunkSize);
      const q = 'action=set&rows=' + encodeURIComponent(JSON.stringify(chunk));
      const data = await jsonp(SHEET.syncUrl + (SHEET.syncUrl.includes('?')?'&':'?') + q, 30000);
      if (!data || data.ok === false) throw new Error((data && data.error) || 'Push failed');
      done += (data.updated != null ? data.updated : chunk.length);
      if (!silent) toast('Pushed ' + done + '/' + rows.length);
    }
    toast(silent ? 'Sheet synced' : ('Sheet updated (' + rows.length + ' rows)'));
  } catch (err) {
    toast(String(err.message || err));
  } finally {
    _pushBusy = false;
  }
}

async function syncNow() {
  await pushToSheet({ silent: true });
  await pullFromSheet();
}

function resetAll() {
  if (!confirm('Reset all done/skipped/notes on this device?')) return;
  state = { branches: {}, dayNotes: {}, adds: {}, updatedAt: null };
  localStorage.removeItem(STORAGE_KEY);
  saveState();
  render();
  toast('Progress reset');
}

document.querySelectorAll('.tab').forEach(btn => {

});

document.getElementById('btnSync').addEventListener('click', syncNow);
document.getElementById('btnMore').addEventListener('click', () => document.getElementById('moreModal').classList.add('show'));
document.getElementById('btnCloseMore').addEventListener('click', () => document.getElementById('moreModal').classList.remove('show'));

});

document.getElementById('addStopModal').addEventListener('click', (e) => {

});
document.getElementById('addStopSearch').addEventListener('input', renderAddStopList);
document.getElementById('addStopFilter').addEventListener('click', (e) => {
  const btn = e.target.closest('[data-filter]');
  if (!btn) return;
  addStopFilter = btn.dataset.filter === 'all' ? 'all' : 'open';
  document.querySelectorAll('#addStopFilter [data-filter]').forEach(b => {
    b.classList.toggle('active', b.dataset.filter === addStopFilter);
  });
  renderAddStopList();
});
document.getElementById('btnJumpAll').addEventListener('click', () => {
  document.getElementById('moreModal').classList.remove('show');
  setTab('all');
});
document.getElementById('btnPullOnly').addEventListener('click', () => {
  document.getElementById('moreModal').classList.remove('show');
  pullFromSheet();
});
document.getElementById('btnPushOnly').addEventListener('click', () => {
  document.getElementById('moreModal').classList.remove('show');
  pushToSheet();
});
document.getElementById('btnReset').addEventListener('click', resetAll);
document.getElementById('btnDockMaps').addEventListener('click', (e) => {
  if (e.currentTarget.classList.contains('disabled')) e.preventDefault();
});

setTab('today');
updateStats();
